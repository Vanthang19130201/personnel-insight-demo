# Only enable on approved internal infrastructure. Do not expose directly on public Internet.
spring.datasource.url=${DB_URL:jdbc:mysql://127.0.0.1:3306/personnel_insight?useUnicode=true&characterEncoding=UTF-8}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.username=${DB_USER:personnelapp}
spring.datasource.password=${DB_PASSWORD}
spring.sql.init.mode=always
server.address=${SERVER_ADDRESS:0.0.0.0}
server.port=${PORT:8080}
